name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # Interim gate (pre SDK release): the device entry, the SDK-CLI build
      # flow, and the real-browser suites need the unreleased SDK surface;
      # that cross-repo integration lives in the ai-passport.mbt CI, which
      # checks this public template out as a fixture. Until the next
      # ai-passport release publishes the device surface, this pipeline
      # exercises only the published dependency — no private SDK checkout,
      # no faked green. When the release ships: bump the pin below, restore
      # the full-module checks and the passport-CLI build steps.
      - name: Resolve the published dependencies
        run: |
          test ! -e moon.work
          grep -q 'colmugx/ai-passport@0.0.3' moon.mod
          moon update

      - name: Install ffmpeg for the asset tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Asset normalization is deterministic
        run: |
          moon run tools/assets.mbtx
          git diff --exit-code

      - name: Published-surface checks and tests
        run: |
          for target in native js wasm; do
            moon check --target "$target" --output-json src/app src/forest_walk src/runtime_wasm
            moon test --target "$target" --output-json src/app src/forest_walk
          done

      - name: Wasm entry build and ABI v0 surface
        run: |
          moon build --target wasm --release src/runtime_wasm
          test -f _build/wasm/release/build/runtime_wasm/runtime_wasm.wasm
          node -e '
            const fs = require("fs");
            const mod = new WebAssembly.Module(fs.readFileSync(
              "_build/wasm/release/build/runtime_wasm/runtime_wasm.wasm"));
            const names = WebAssembly.Module.imports(mod).map((i) => i.name);
            if (names.includes("host_pcm_write")) {
              throw new Error("runtime_wasm imports passport.host_pcm_write (forbidden in PCM asset mode)");
            }
            for (const n of ["host_battery_percent", "host_set_volume", "host_set_muted", "host_playback_pos_us"]) {
              if (!names.includes(n)) throw new Error("missing required import " + n);
            }
            const exports = WebAssembly.Module.exports(mod).map((e) => e.name);
            for (const n of ["memory", "passport_frame", "passport_input", "passport_fb_ptr",
                             "passport_fb_len", "passport_frame_dirty", "passport_frame_consume"]) {
              if (!exports.includes(n)) throw new Error("missing required export " + n);
            }
            console.log("wasm ABI surface ok; imports: " + names.join(", "));
          '

      - name: Test Python asset and audio tooling
        run: python3 -m unittest discover -s tools -p "test_*.py"

      - name: Formatting
        run: |
          moon fmt
          git diff --exit-code
