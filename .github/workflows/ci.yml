name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve published SDK
        run: |
          test ! -e moon.work
          moon update

      - name: Verify generated asset sources
        run: |
          ./tools/compile_assets.sh
          git diff --exit-code

      - name: Convert and verify authored device music
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tools/compile_audio.py

      - name: Test Python asset and audio tooling
        run: |
          python3 -m unittest discover -s tools -p "test_*.py"

      - name: Check and test native
        run: |
          moon check --target native --output-json
          moon test --target native --output-json

      - name: Check and test JavaScript
        run: |
          moon check --target js --output-json
          moon test --target js --output-json

      - name: Build browser preview bundle
        run: |
          moon build --target js
          test -f _build/js/debug/build/web/web.js

      - name: Check generated API and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
