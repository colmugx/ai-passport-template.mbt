name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # Everything the template consumes from the SDK resolves from the
      # published Mooncakes package; `moon check` materializes it under
      # .mooncakes (moon update alone only refreshes the index).
      - name: Resolve the published dependencies
        run: |
          grep -q 'colmugx/ai-passport@0.2.3' moon.mod
          moon update
          moon check --target native
          test -f .mooncakes/colmugx/ai-passport/hosts/web/index.html
          test -f .mooncakes/colmugx/ai-passport/hosts/folotoy/ai-passport/main/app_main.c

      - name: Full-module checks and tests
        run: |
          for target in native js wasm; do
            moon check --target "$target" --output-json
            moon test --target "$target" --output-json
          done

      - name: Assert the committed canonical PCM identity
        run: |
          sha256sum assets/forest_walk.pcm
          test "$(sha256sum assets/forest_walk.pcm | cut -d' ' -f1)" = "a848e82fa15266fc474ccc2d9656e30ab24081d690d4944767c332fb7866010a"
          test "$(stat -c %s assets/forest_walk.pcm)" = "2444800"

      - name: Web build through the published SDK CLI
        run: |
          moonx colmugx/ai-passport/cmd/passport@0.2.3 build --host web
          test -f .passport/web/app.wasm
          test -f .passport/web/index.html
          test -f .passport/web/passport-host.js
          test -f .passport/web/sound-worklet.js
          test -s .passport/web/sounds.bank

      - name: Formatting
        run: |
          moon fmt
          git diff --exit-code

  device:
    # The real device build proves the RELEASED package: the published
    # SDK's Host glue (from .mooncakes) + the template's pinned FoloToy
    # submodule, under ESP-IDF 5.5.3. No SDK source checkout, no flash.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Resolve the published dependencies
        run: |
          grep -q 'colmugx/ai-passport@0.2.3' moon.mod
          moon update
          moon check --target native
          test -f .mooncakes/colmugx/ai-passport/hosts/folotoy/ai-passport/main/app_main.c

      # Container steps default to plain sh; IDF's export.sh and pipefail
      # need bash (present in the image).
      - name: Real device build (ESP-IDF 5.5.3, no flash)
        shell: bash
        run: |
          set -eo pipefail
          . /opt/esp/idf/export.sh
          moonx colmugx/ai-passport/cmd/passport@0.2.3 build --host folotoy-ai-passport | tee /tmp/device-build.log
          test -f .passport/folotoy-ai-passport/build/ai_passport_app.bin
          grep -q "folotoy-ai-passport dependency:" /tmp/device-build.log
          size=$(stat -c %s .passport/folotoy-ai-passport/build/ai_passport_app.bin)
          test "$size" -gt 0 -a "$size" -le 3670016
          margin="$(grep -oE 'app partition margin: [0-9]+ bytes' /tmp/device-build.log | head -n1 || true)"
          test -n "$margin"
          echo "firmware size: $size / 3670016 bytes (0x380000 app partition)"
          echo "passport: $margin"
