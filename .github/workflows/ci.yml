name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert the FoloToy submodule revision
        run: |
          rev="$(git -C external/folotoy-ai-passport rev-parse HEAD)"
          echo "external/folotoy-ai-passport @ $rev"
          test "$rev" = "c21a015d44f2bcc02b4d859532d74cd7aefe69be"

      - name: Install MoonBit
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The public-user path: everything the template consumes from the SDK
      # resolves from the published Mooncakes package. There is deliberately
      # no ai-passport.mbt checkout, no AI_PASSPORT_SDK, and no overlay.
      - name: Resolve the published dependencies
        run: |
          test ! -e moon.work
          test ! -e tools/sync-dev-sdk.sh
          grep -q 'colmugx/ai-passport@0.0.4' moon.mod
          moon update
          moon check --target native
          test -f .mooncakes/colmugx/ai-passport/hosts/web/index.html
          test -f .mooncakes/colmugx/ai-passport/hosts/folotoy/ai-passport/main/app_main.c

      - name: Install ffmpeg for the asset tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Asset normalization is deterministic
        run: |
          moon run tools/assets.mbtx
          git diff --exit-code

      - name: Full-module checks and tests
        run: |
          for target in native js wasm; do
            moon check --target "$target" --output-json
            moon test --target "$target" --output-json
          done

      - name: Wasm entry build and ABI v0 surface
        run: |
          moon build --target wasm --release src/runtime_wasm
          test -f _build/wasm/release/build/runtime_wasm/runtime_wasm.wasm
          node -e '
            const fs = require("fs");
            const mod = new WebAssembly.Module(fs.readFileSync(
              "_build/wasm/release/build/runtime_wasm/runtime_wasm.wasm"));
            const names = WebAssembly.Module.imports(mod).map((i) => i.name);
            if (names.includes("host_pcm_write")) {
              throw new Error("runtime_wasm imports passport.host_pcm_write (forbidden in PCM asset mode)");
            }
            for (const n of ["host_battery_percent", "host_set_volume", "host_set_muted", "host_playback_pos_us"]) {
              if (!names.includes(n)) throw new Error("missing required import " + n);
            }
            const exports = WebAssembly.Module.exports(mod).map((e) => e.name);
            for (const n of ["memory", "passport_frame", "passport_input", "passport_fb_ptr",
                             "passport_fb_len", "passport_frame_dirty", "passport_frame_consume"]) {
              if (!exports.includes(n)) throw new Error("missing required export " + n);
            }
            console.log("wasm ABI surface ok; imports: " + names.join(", "));
          '

      - name: Web build through the published SDK CLI
        run: |
          moon run tools/passport.mbtx build web
          test -f .passport/web/app.wasm
          test -f .passport/web/index.html
          test -f .passport/web/passport-host.js
          test -f .passport/web/pcm-worklet.js
          cmp .passport/assets/forest_walk.pcm .passport/web/assets/forest_walk.pcm
          python3 tools/verify_pcm_identity.py

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pinned playwright and its chromium
        run: npx -y playwright@1.63.0 install chromium --with-deps

      - name: Browser integration over the built bundle
        run: node tools/web-integration/run.mjs

      - name: Test Python asset and audio tooling
        run: python3 -m unittest discover -s tools -p "test_*.py"

      - name: Formatting
        run: |
          moon fmt
          git diff --exit-code

  device:
    # The real device build proves the RELEASED package: the published
    # SDK's Host glue (from .mooncakes) + the template's pinned FoloToy
    # submodule, under ESP-IDF 5.5.3. No SDK source checkout, no flash.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert the FoloToy submodule revision
        run: |
          rev="$(git -C external/folotoy-ai-passport rev-parse HEAD)"
          echo "external/folotoy-ai-passport @ $rev"
          test "$rev" = "c21a015d44f2bcc02b4d859532d74cd7aefe69be"

      - name: Set up MoonBit and ffmpeg
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          "$HOME/.moon/bin/moon" version --all

      - name: Resolve the published dependencies
        run: |
          test ! -e moon.work
          test ! -e tools/sync-dev-sdk.sh
          grep -q 'colmugx/ai-passport@0.0.4' moon.mod
          moon update
          moon check --target native
          test -f .mooncakes/colmugx/ai-passport/hosts/folotoy/ai-passport/main/app_main.c

      # Container steps default to plain sh; IDF's export.sh and pipefail
      # need bash (present in the image).
      - name: Real device build (ESP-IDF 5.5.3, no flash)
        shell: bash
        run: |
          set -eo pipefail
          . /opt/esp/idf/export.sh
          moon run tools/passport.mbtx build device | tee /tmp/device-build.log
          test -f .passport/folotoy-ai-passport/build/ai_passport_app.bin
          grep -q "dependency: .*/external/folotoy-ai-passport @ c21a015d44f2bcc02b4d859532d74cd7aefe69be (project-provided)" /tmp/device-build.log
          size=$(stat -c %s .passport/folotoy-ai-passport/build/ai_passport_app.bin)
          test "$size" -gt 0 -a "$size" -le 3670016
          margin="$(grep -oE 'app partition margin: [0-9]+ bytes' /tmp/device-build.log | head -n1 || true)"
          test -n "$margin"
          echo "firmware size: $size / 3670016 bytes (0x380000 app partition)"
          echo "passport: $margin"
